# Updated for Hierarchical Process
collection_objective:
  description: >
    1. Call the SharePoint Navigator tool EXACTLY ONCE to identify the date of the last and upcoming 'Board Meeting'. Save these dates in your memory.
    2. Using the saved 'last meeting' date as the starting point, iterate through the following externalized committee list: {committee_list}.
    3. For each entry, access the specified 'site_id' and 'section_id' in OneNote.
    4. Extract all meeting pages created after the saved last Board meeting date.
    5. Label each extract with the Committee Name and Meeting Date.
    CRITICAL: Do NOT call the SharePoint Navigator tool for each committee. You must only call it once at the very beginning and reuse the date.
    If the SharePointTool or OneNoteTool returns an error, OR you cannot find a valid date, do NOT improvise.
    Do NOT ask a coworker for help. Accept the error and return `content: "Error: [paste error here]"` and `has_data: false`.
  expected_output: >
    A structured repository of raw meeting text, organized by committee name. 
    You MUST output valid JSON matching the CoordinatorOutput schema.
    For each committee, you MUST return a dictionary with exactly 3 keys:
    1. "name": The committee name.
    2. "content": The raw text of the meeting minutes (or a string saying "No meetings found for [Committee Name]").
    3. "has_data": A boolean (true or false) indicating if meeting text was successfully extracted. NEVER use 'has_content', use 'has_data'.
  agent: meeting_coordinator

synthesis_objective:
  description: |
    Transform the gathered raw minutes into a professional, concise Board Report. 
    You MUST output the report for EACH committee using the EXACT following markdown structure (including line breaks):
    
    ## [Committee Name] **Summary:** 
    [Write a cohesive 2-4 sentence professional summary of the main discussion points here. Synthesize the text into a paragraph. Do NOT just list bullet points and do NOT list attendees.]
    
    **I. Action Items**
    | Item | Owner | Deadline |
    |---|---|---|
    | [Task] | [Person] | [Date or TBD] |
    
    **II. High Priority Items Requiring Full Board Vote**
    *   **[Topic]:** [Explanation of what requires Full Board vote/approval, or write 'None specified.']
    
    CRITICAL: You MUST use Markdown tables for Action Items. You MUST write actual summary paragraphs, not just copy raw bullet points.
    CRITICAL: If a committee's text contains an Error or says "No meetings found", DO NOT attempt to troubleshoot, resolve, or summarize the technical error. You are a Document Specialist, not IT. For that committee, you MUST output ONLY the following, with no other sections:
    
    ## [Committee Name] **Summary:** Data unavailable.
    
    CRITICAL: Do NOT include any 'Additional Notes', 'Recommendations', 'Advice', or conversational text. Your summary MUST contain ONLY the factual information from the minutes provided.
  expected_output: |
    A comprehensive Markdown draft of the Committee Reports that MUST strictly use this EXACT format:
    
    ## [Committee Name] **Summary:** 
    [Write a cohesive 2-4 sentence professional summary of the main discussion points here. Synthesize the text into a paragraph. Do NOT just list bullet points and do NOT list attendees.]
    
    **I. Action Items**
    | Item | Owner | Deadline |
    |---|---|---|
    | [Task] | [Person] | [Date or TBD] |
    
    **II. High Priority Items Requiring Full Board Vote**
    *   **[Topic]:** [Explanation of what requires Full Board vote/approval, or write 'None specified.']
    
    EXCEPTION: If a committee has no meetings or missing data, you MUST output ONLY the following for that committee (DO NOT include the Action Items or High Priority sections):
    ## [Committee Name] **Summary:** Data unavailable.
  agent: document_summarizer

final_audit_objective:
  description: |
    Perform a final quality and policy audit on the drafted report.
    1. Add the exact following title block to the VERY TOP of the document:
       ## Board Report - [Date of Upcoming Board Meeting]
       ## Date of Last Board Meeting: [Date of Last Board Meeting]
       (where you substitute the actual dates stored in memory by the coordinator)
    2. Verify that the document follows the nonprofit's standard header and versioning format.
    3. Ensure all action items are clearly formatted in Markdown tables.
    4. Use the 'upcoming_board_date' (identified by the Coordinator in the first task) 
       to generate the final filename.
    5. Check that the final output is a clean, professional Markdown file ready for SharePoint upload.
    CRITICAL: You MUST perfectly preserve the section headers, spacing, and summary paragraphs passed to you by the document summarizer. Do not collapse lines or alter the data layout.
    CRITICAL: Do NOT add any 'Additional Notes', commentary, or unprompted follow-up items to the end of the document.
  expected_output: >
    A final, submission-ready file named 'Board_Committee_Reports_[upcoming_board_date]_Draft.md'.
  agent: policy_compliance_officer