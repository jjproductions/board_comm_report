[project]
name = "board_comm_report"
version = "0.1.0"
description = "board-comm-report using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3"
]

[project.scripts]
board_comm_report = "board_comm_report.main:run"
run_crew = "board_comm_report.main:run"
train = "board_comm_report.main:train"
replay = "board_comm_report.main:replay"
test = "board_comm_report.main:test"
run_with_trigger = "board_comm_report.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
